  </defs>
  <circle cx="256" cy="256" r="250" fill="url(#ocean)" stroke="#1a5e9a" stroke-width="8"/>
  <!-- Continents: stylized but accurate -->
  <path d="M180 180 Q200 120 270 110 Q340 100 370 180 Q400 260 340 270 Q320 260 320 230 Q320 200 320 180 Z" fill="#b7d97a" stroke="#7fa34b" stroke-width="4"/>
  <path d="M120 220 Q140 180 200 200 Q220 220 200 250 Q180 270 140 250 Q120 240 120 220 Z" fill="#b7d97a" stroke="#7fa34b" stroke-width="4"/>
  <path d="M350 320 Q370 300 400 320 Q410 340 390 360 Q370 370 350 350 Q340 340 350 320 Z" fill="#b7d97a" stroke="#7fa34b" stroke-width="4"/>
  <ellipse cx="400" cy="340" rx="18" ry="10" fill="#b7d97a" stroke="#7fa34b" stroke-width="3"/>
  <ellipse cx="270" cy="90" rx="18" ry="10" fill="#b7d97a" stroke="#7fa34b" stroke-width="3"/>
  <!-- Clouds -->
  <ellipse cx="120" cy="100" rx="30" ry="18" fill="#fff" filter="url(#cloud)"/>
  <ellipse cx="400" cy="80" rx="22" ry="14" fill="#fff" filter="url(#cloud)"/>
  <ellipse cx="370" cy="400" rx="28" ry="16" fill="#fff" filter="url(#cloud)"/>
